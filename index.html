<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedGate — Verified Speed. For Every Athlete.</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ───── TOKENS ───── */
:root {
  --bg-0: #0A0B0E;
  --bg-1: #101216;
  --bg-2: #16191F;
  --bg-3: #1C2128;
  --border: #21262D;
  --border-strong: #2D343C;
  --text: #F2F2EE;
  --text-dim: #C7CDD3;
  --muted: #8B95A3;
  --dim: #4A525E;

  --accent: #39FF14;          /* PRECISION green — data/timing only */
  --accent-glow: rgba(57,255,20,0.22);
  --accent-soft: rgba(57,255,20,0.08);

  --cta: #FF5C1F;             /* SAFETY orange — primary CTA only */
  --cta-hi: #FF7340;
  --cta-soft: rgba(255,92,31,0.10);

  --paper: #F2F2EE;           /* inverse surfaces */
  --paper-2: #E6E5DD;
  --ink: #0A0B0E;

  --font-display: 'Big Shoulders Display', 'Impact', sans-serif;
  --font-ui: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--font-ui);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  text-rendering: optimizeLegibility;
}

/* film grain on the whole page */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.04;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

::selection { background: var(--accent); color: var(--ink); }

/* ───── LAYOUT PRIMITIVES ───── */
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 32px; }
.wrap-tight { max-width: 1080px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 720px) { .wrap, .wrap-tight { padding: 0 20px; } }

/* eyebrows / section labels */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 500;
}
.eyebrow::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--accent);
  display: inline-block;
}
.eyebrow.dim { color: var(--muted); }
.eyebrow.dim::before { background: var(--muted); }

/* display type */
.display {
  font-family: var(--font-display);
  font-weight: 800;
  line-height: 0.88;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.display .alt { color: var(--accent); }

.kicker {
  font-family: var(--font-ui);
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

/* buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 52px;
  padding: 0 28px;
  border-radius: 4px;
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
  white-space: nowrap;
}
.btn-primary { background: var(--cta); color: var(--ink); }
.btn-primary:hover { background: var(--cta-hi); transform: translateY(-1px); box-shadow: 0 8px 32px rgba(255,92,31,0.30); }
.btn-primary .price-tag {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 13px;
  padding: 3px 8px;
  background: rgba(10,11,14,0.18);
  border-radius: 2px;
  margin-left: 4px;
}
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
.btn-ghost:hover { border-color: var(--text); }
.btn-sm { height: 40px; padding: 0 18px; font-size: 12px; }
.btn-lg { height: 60px; padding: 0 36px; font-size: 15px; }

/* arrow icon */
.arr {
  display: inline-block;
  width: 18px; height: 12px;
  position: relative;
  transition: transform 0.2s ease;
}
.arr::before {
  content: '';
  position: absolute;
  inset: 5px 0;
  border-top: 2px solid currentColor;
}
.arr::after {
  content: '';
  position: absolute;
  right: 0; top: 0;
  width: 12px; height: 12px;
  border-top: 2px solid currentColor;
  border-right: 2px solid currentColor;
  transform: rotate(45deg);
  transform-origin: top right;
}
.btn:hover .arr { transform: translateX(4px); }

/* ───── NAV ───── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 64px;
  z-index: 100;
  background: rgba(10,11,14,0.82);
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  border-bottom: 1px solid var(--border);
}
.nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100%;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
}
.brand-mark {
  width: 32px; height: 32px;
  display: grid;
  place-items: center;
}
.brand-word {
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 800;
  font-size: 17px;
  letter-spacing: 0.18em;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 28px;
  list-style: none;
}
.nav-links a {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  transition: color 0.18s;
}
.nav-links a:hover { color: var(--accent); }
.nav-spots {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.nav-spots b { color: var(--accent); font-weight: 700; }
.nav-spots-text { white-space: nowrap; }
.nav-spots .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
@media (max-width: 1180px) {
  .nav-spots { display: none; }
}
@media (max-width: 1080px) {
  .nav-links { display: none; }
}

/* ───── HERO ───── */
.hero {
  padding: 132px 0 80px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 60%;
  height: 100%;
  background: radial-gradient(circle at 80% 30%, rgba(57,255,20,0.05), transparent 60%);
  pointer-events: none;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 80px;
  align-items: end;
  min-height: 640px;
}
@media (max-width: 1080px) {
  .hero-grid { grid-template-columns: 1fr; gap: 56px; }
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
}
.hero-meta .live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
}
.hero-meta .live::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 1.6s infinite;
}
.hero-meta .sep {
  width: 24px; height: 1px;
  background: var(--dim);
}

.hero h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(64px, 11vw, 168px);
  line-height: 0.86;
  letter-spacing: -0.015em;
  text-transform: uppercase;
  margin-bottom: 32px;
}
.hero h1 .line { display: block; }
.hero h1 .line-2 {
  color: var(--accent);
  font-style: italic;
  font-weight: 900;
}
.hero h1 .punct { color: var(--cta); }

.hero-sub {
  font-size: 19px;
  color: var(--text-dim);
  line-height: 1.5;
  max-width: 540px;
  margin-bottom: 40px;
  font-weight: 400;
}
.hero-sub b { color: var(--text); font-weight: 600; }

.hero-cta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  margin-bottom: 48px;
}
.hero-cta-row .trust {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.hero-cta-row .trust b { color: var(--accent); font-weight: 700; }

.hero-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.hero-strip .cell {
  background: var(--bg-0);
  padding: 18px 4px 14px;
}
.hero-strip .v {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 22px;
  color: var(--text);
  line-height: 1;
  margin-bottom: 6px;
}
.hero-strip .v .unit { color: var(--accent); }
.hero-strip .l {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--muted);
  text-transform: uppercase;
}
@media (max-width: 720px) {
  .hero-strip { grid-template-columns: 1fr 1fr; }
}

/* ───── CAPTURE PANEL (hero right) ───── */
.capture {
  position: relative;
  width: 100%;
  aspect-ratio: 4/5;
  max-height: 640px;
  background: linear-gradient(180deg, #0c0d11 0%, #131520 100%);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  overflow: hidden;
  font-family: var(--font-mono);
}
.capture .frame-corner {
  position: absolute;
  width: 18px; height: 18px;
  border: 1.5px solid var(--accent);
}
.capture .frame-corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
.capture .frame-corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
.capture .frame-corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
.capture .frame-corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

.capture .hud-top {
  position: absolute;
  top: 28px; left: 28px; right: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  text-transform: uppercase;
}
.capture .hud-top .rec {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--cta);
}
.capture .hud-top .rec::before {
  content: '';
  width: 8px; height: 8px;
  background: var(--cta);
  border-radius: 50%;
  animation: pulse 0.9s infinite;
}

.capture .timer-big {
  position: absolute;
  top: 60px; left: 28px;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 56px;
  color: var(--accent);
  letter-spacing: -0.04em;
  line-height: 1;
  text-shadow: 0 0 24px var(--accent-glow);
}
.capture .timer-big .ms { font-size: 28px; opacity: 0.7; }
.capture .timer-label {
  position: absolute;
  top: 124px; left: 28px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.capture .runner-zone {
  position: absolute;
  inset: auto 0 0 0;
  height: 48%;
  overflow: hidden;
}
.capture .track-floor {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 38%;
  background:
    linear-gradient(180deg, transparent, rgba(57,255,20,0.05) 40%, rgba(57,255,20,0.12)),
    repeating-linear-gradient(90deg, transparent 0 32px, rgba(57,255,20,0.18) 32px 33px);
  transform: perspective(400px) rotateX(54deg);
  transform-origin: bottom;
}
.capture .gate-l, .capture .gate-r {
  position: absolute;
  bottom: 6%;
  width: 3px;
  height: 78%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.capture .gate-l { left: 10%; }
.capture .gate-r { right: 10%; }
.capture .laser-line {
  position: absolute;
  left: 10%; right: 10%;
  bottom: 32%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.55;
  animation: laser 1.6s ease-in-out infinite;
}
@keyframes laser {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 0.95; }
}

.capture .runner {
  position: absolute;
  bottom: 6%;
  width: 70px;
  height: 110px;
  left: 12%;
}

.capture .biomech-dot {
  position: absolute;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  transform: translate(-50%, -50%);
  transition: opacity 0.2s;
}

.capture .stamp {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(-4deg);
  padding: 14px 20px;
  border: 1.5px solid var(--accent);
  background: rgba(10,11,14,0.55);
  backdrop-filter: blur(6px);
  color: var(--accent);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 10;
}
.capture .stamp::before {
  content: '✓';
  margin-right: 8px;
}
.capture.is-verified .stamp { opacity: 1; }

.capture .hud-data {
  position: absolute;
  top: 60px; right: 28px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
  z-index: 5;
}
.capture .data-row {
  display: grid;
  grid-template-columns: auto auto;
  gap: 10px;
  align-items: baseline;
  font-size: 11px;
  letter-spacing: 0.1em;
}
.capture .data-row .k {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.capture .data-row .v {
  color: var(--accent);
  font-weight: 700;
  font-family: var(--font-mono);
  font-size: 13px;
  min-width: 64px;
  text-align: right;
}

/* ───── SECTION BASE ───── */
section { padding: 120px 0; position: relative; }
@media (max-width: 720px) { section { padding: 84px 0; } }

.sec-head {
  display: grid;
  grid-template-columns: 0.9fr 1.6fr;
  gap: 60px;
  align-items: end;
  margin-bottom: 64px;
}
@media (max-width: 980px) {
  .sec-head { grid-template-columns: 1fr; gap: 24px; }
}
.sec-head h2 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(40px, 5.5vw, 88px);
  line-height: 0.92;
  letter-spacing: -0.012em;
  text-transform: uppercase;
}
.sec-head h2 .alt { color: var(--accent); font-style: italic; }
.sec-head h2 .o { color: var(--cta); }
.sec-head .lede {
  font-size: 17px;
  color: var(--text-dim);
  line-height: 1.55;
  max-width: 480px;
}
.sec-head .lede b { color: var(--text); font-weight: 600; }

/* ───── DEMO SECTION ───── */
.demo {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(57,255,20,0.05), transparent 60%),
    var(--bg-1);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.demo-shell {
  background: var(--bg-0);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.8fr 1fr;
}
@media (max-width: 980px) {
  .demo-shell { grid-template-columns: 1fr; }
}
.demo-stage {
  position: relative;
  aspect-ratio: 16/10;
  background: linear-gradient(180deg, #0a0c12, #131722);
  overflow: hidden;
  border-right: 1px solid var(--border-strong);
}
@media (max-width: 980px) {
  .demo-stage { border-right: none; border-bottom: 1px solid var(--border-strong); }
}
.demo-side {
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.demo-layers-title {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.layer-toggle {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.18s;
  margin-bottom: 8px;
  font-family: var(--font-ui);
}
.layer-toggle:hover { border-color: var(--border-strong); }
.layer-toggle.on { border-color: var(--accent); background: var(--accent-soft); }
.layer-toggle .lt-name {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text);
}
.layer-toggle .lt-desc {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  text-transform: none;
  letter-spacing: 0;
}
.layer-toggle .lt-sw {
  width: 32px; height: 18px;
  border-radius: 999px;
  background: var(--bg-3);
  border: 1px solid var(--border-strong);
  position: relative;
  transition: all 0.18s;
}
.layer-toggle .lt-sw::after {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--muted);
  top: 2px; left: 2px;
  transition: all 0.18s;
}
.layer-toggle.on .lt-sw { background: var(--accent); border-color: var(--accent); }
.layer-toggle.on .lt-sw::after { left: 16px; background: var(--ink); }

.demo-stat-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 18px;
}
.demo-stat-card h4 {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
}
.demo-stat-card h4 .verified {
  color: var(--accent);
}
.demo-stat-card .big {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 38px;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1;
  margin-bottom: 14px;
}
.demo-stat-card .big .alt { color: var(--accent); }
.demo-stat-card .row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  font-size: 12px;
}
.demo-stat-card .row .k { color: var(--muted); }
.demo-stat-card .row .v { color: var(--text); font-family: var(--font-mono); font-weight: 500; }

/* demo stage internals */
.stage-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 32px 32px;
}
.stage-hud-top {
  position: absolute;
  top: 16px; left: 16px; right: 16px;
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  text-transform: uppercase;
  z-index: 4;
}
.stage-timer {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: clamp(40px, 7vw, 84px);
  color: var(--accent);
  letter-spacing: -0.03em;
  text-shadow: 0 0 32px var(--accent-glow);
  line-height: 1;
}
.stage-timer .ms { font-size: 0.55em; opacity: 0.7; }
.stage-timer-pos {
  position: absolute;
  top: 56px; left: 28px;
  z-index: 4;
}
.stage-timer-label {
  position: absolute;
  top: 32px; left: 28px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
  z-index: 4;
}

.stage-figure {
  position: absolute;
  bottom: 18%;
  width: 80px;
  height: 130px;
  transform: translateX(-50%);
  z-index: 3;
}

.stage-track {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  height: 28%;
  background:
    linear-gradient(180deg, transparent, rgba(57,255,20,0.06) 40%, rgba(57,255,20,0.12)),
    repeating-linear-gradient(90deg, transparent 0 60px, rgba(57,255,20,0.16) 60px 61px);
  transform: perspective(500px) rotateX(58deg);
  transform-origin: bottom;
}

.stage-gates {
  position: absolute;
  bottom: 18%;
  left: 0; right: 0;
  height: 80px;
}
.stage-gate {
  position: absolute;
  bottom: 0;
  width: 4px; height: 70px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.stage-gate.start { left: 14%; }
.stage-gate.end { left: 84%; }

.stage-zones {
  position: absolute;
  left: 14%; right: 16%;
  bottom: 18%;
  display: flex;
  pointer-events: none;
}
.stage-zone {
  flex: 1;
  height: 70px;
  border-top: 1px solid rgba(57,255,20,0.5);
  border-right: 1px dashed rgba(57,255,20,0.3);
  position: relative;
}
.stage-zone:last-child { border-right: 1px solid rgba(57,255,20,0.5); }
.stage-zone .zlabel {
  position: absolute;
  top: -22px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--accent);
}

.stage-bio-dot {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  transform: translate(-50%, -50%);
  z-index: 5;
}
.stage-bio-line {
  position: absolute;
  height: 1px;
  background: rgba(57,255,20,0.5);
  transform-origin: 0 0;
  z-index: 4;
}

.stage-ball {
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--cta);
  box-shadow: 0 0 16px rgba(255,92,31,0.6);
  z-index: 6;
}
.stage-ball-trail {
  position: absolute;
  pointer-events: none;
  z-index: 5;
}

.stage-scrub {
  position: absolute;
  left: 24px; right: 24px;
  bottom: 16px;
  z-index: 8;
}
.stage-scrub-bar {
  position: relative;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  cursor: pointer;
}
.stage-scrub-bar .fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--accent);
  border-radius: 2px;
}
.stage-scrub-bar .knob {
  position: absolute;
  top: 50%;
  width: 16px; height: 16px;
  background: var(--text);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.stage-scrub-times {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.1em;
}
.stage-scrub-play {
  position: absolute;
  left: 50%;
  bottom: 56px;
  transform: translateX(-50%);
  width: 56px; height: 56px;
  background: rgba(10,11,14,0.6);
  border: 1px solid var(--border-strong);
  backdrop-filter: blur(8px);
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.18s;
  z-index: 9;
}
.stage-scrub-play:hover { background: var(--accent); border-color: var(--accent); }
.stage-scrub-play:hover svg { fill: var(--ink); }
.stage-scrub-play svg { fill: var(--text); width: 20px; height: 20px; }

/* ───── WEDGE / COMPARE ───── */
.wedge { background: var(--bg-0); }
.wedge-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
@media (max-width: 880px) {
  .wedge-row { grid-template-columns: 1fr; }
}
.wedge-cell {
  background: var(--bg-1);
  padding: 40px 32px 44px;
  display: flex;
  flex-direction: column;
  min-height: 360px;
}
.wedge-cell.win { background: var(--bg-2); position: relative; }
.wedge-cell.win::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
}
.wedge-cell .num {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--muted);
  margin-bottom: 32px;
}
.wedge-cell.win .num { color: var(--accent); }
.wedge-cell h3 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 36px;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  line-height: 0.95;
  margin-bottom: 20px;
}
.wedge-cell h3 .alt { color: var(--accent); }
.wedge-cell p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 32px;
}
.wedge-meta {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.wedge-meta .mrow {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 12px;
}
.wedge-meta .k {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.wedge-meta .v.bad { color: #FF5252; }
.wedge-meta .v.warn { color: #FFB800; }
.wedge-meta .v.good { color: var(--accent); }

.wedge-cell .verdict {
  margin-top: 24px;
  padding: 12px 14px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
}
.wedge-cell .verdict.bad { background: rgba(255,82,82,0.08); color: #FF5252; border: 1px solid rgba(255,82,82,0.2); }
.wedge-cell .verdict.warn { background: rgba(255,184,0,0.08); color: #FFB800; border: 1px solid rgba(255,184,0,0.2); }
.wedge-cell .verdict.good { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(57,255,20,0.25); }

/* ───── SKILLS / SPORT SWITCHER ───── */
.skills {
  background: var(--bg-1);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.sport-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 48px;
}
.sport-tab {
  padding: 16px 24px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.18s;
  margin-bottom: -1px;
}
.sport-tab:hover { color: var(--text); }
.sport-tab.on { color: var(--text); border-bottom-color: var(--accent); }

.sport-panel {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 40px;
  align-items: start;
}
@media (max-width: 980px) { .sport-panel { grid-template-columns: 1fr; gap: 32px; } }

.sport-headline {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(36px, 4.5vw, 64px);
  text-transform: uppercase;
  line-height: 0.95;
  letter-spacing: -0.01em;
  margin-bottom: 20px;
}
.sport-headline .alt { color: var(--accent); }
.sport-body {
  font-size: 16px;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 32px;
  max-width: 540px;
}
.sport-metric-row {
  display: flex;
  gap: 32px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.sport-big-metric .v {
  font-family: var(--font-mono);
  font-size: 56px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.03em;
  line-height: 1;
}
.sport-big-metric .l {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 8px;
}

.sport-readouts {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 28px;
}
.sport-readouts h4 {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 18px;
  display: flex;
  justify-content: space-between;
}
.sport-readouts h4 .badge {
  color: var(--accent);
  background: var(--accent-soft);
  padding: 3px 8px;
  border-radius: 2px;
  font-weight: 700;
}
.readout-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.readout-row:last-child { border-bottom: none; }
.readout-name {
  font-size: 13px;
  color: var(--text-dim);
}
.readout-name small {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-top: 2px;
  text-transform: uppercase;
}
.readout-value {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 16px;
  color: var(--accent);
  text-align: right;
}
.readout-value .sub { color: var(--muted); font-size: 11px; margin-left: 4px; font-weight: 400; }

.sport-more {
  margin-top: 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.sport-more .chip {
  padding: 6px 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  color: var(--muted);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.15s;
}
.sport-more .chip:hover { border-color: var(--border-strong); color: var(--text); }
.sport-more .chip.on { background: var(--accent-soft); border-color: rgba(57,255,20,0.3); color: var(--accent); }

/* ───── PRICING ───── */
.pricing { background: var(--bg-0); }
.spots-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 18px;
  background: var(--bg-1);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  margin-bottom: 48px;
  flex-wrap: wrap;
}
.spots-banner .lbl {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--muted);
  text-transform: uppercase;
}
.spots-banner .v {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--accent);
  font-size: 14px;
}
.spots-banner .bar {
  flex: 1;
  max-width: 360px;
  height: 6px;
  background: var(--bg-3);
  border-radius: 999px;
  position: relative;
  overflow: hidden;
}
.spots-banner .bar-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: linear-gradient(90deg, var(--accent), var(--cta));
  border-radius: 999px;
}

.price-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
@media (max-width: 880px) { .price-row { grid-template-columns: 1fr; } }

.price {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 36px 32px 32px;
  display: flex;
  flex-direction: column;
  position: relative;
  transition: all 0.25s ease;
}
.price:hover { transform: translateY(-3px); border-color: var(--border-strong); }
.price.featured {
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(57,255,20,0.15), 0 20px 60px rgba(57,255,20,0.08);
}
.price.featured::before {
  content: 'MOST POPULAR';
  position: absolute;
  top: -1px; left: 50%;
  transform: translate(-50%, -50%);
  background: var(--accent);
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.16em;
  padding: 5px 14px;
  border-radius: 2px;
}
.price-tier {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 24px;
}
.price-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 32px;
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 4px;
}
.price-sub {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 28px;
}
.price-amount {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 4px;
}
.price-amount .amt {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 56px;
  letter-spacing: -0.03em;
  color: var(--text);
  line-height: 1;
}
.price-amount .strike {
  font-family: var(--font-mono);
  font-size: 18px;
  color: var(--muted);
  text-decoration: line-through;
}
.price-save {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 28px;
}
.price-list {
  list-style: none;
  margin-bottom: 32px;
}
.price-list li {
  font-size: 14px;
  color: var(--text-dim);
  padding: 10px 0;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.price-list li::before {
  content: '+';
  color: var(--accent);
  font-weight: 700;
  font-family: var(--font-mono);
  flex-shrink: 0;
  width: 14px;
}
.price-list li.bold { color: var(--text); font-weight: 500; }
.price .btn { width: 100%; margin-top: auto; }

/* ───── FOUNDER ───── */
.founder { background: var(--bg-1); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.founder-grid {
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
  gap: 64px;
  align-items: center;
}
@media (max-width: 980px) {
  .founder-grid { grid-template-columns: 1fr; gap: 40px; }
  .founder-img { max-width: 480px; margin: 0 auto; }
}

.founder-img {
  position: relative;
  aspect-ratio: 4/5;
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  overflow: hidden;
}
.founder-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
  filter: contrast(1.05) saturate(0.9);
}
.founder-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(10,11,14,0.45) 0%, transparent 30%, transparent 60%, rgba(10,11,14,0.6) 100%);
  pointer-events: none;
}
.founder-img .ph {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
  text-align: center;
  padding: 24px;
}
.founder-img .ph::before { content: '◢'; display: block; font-size: 28px; margin-bottom: 12px; color: var(--accent); }

.founder-img-meta {
  position: absolute;
  bottom: 16px;
  left: 16px;
  right: 16px;
  z-index: 2;
}
.fim-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: rgba(10,11,14,0.72);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  justify-content: space-between;
}
.fim-sep {
  flex: 1;
  height: 1px;
  background: var(--border-strong);
}

.founder-tag {
  position: absolute;
  top: 16px; left: 16px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.founder-tag .badge {
  display: inline-flex;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 5px 10px;
  background: rgba(10,11,14,0.7);
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  color: var(--accent);
}

.founder-quote {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(24px, 2.6vw, 36px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin-bottom: 28px;
  text-transform: uppercase;
}
.founder-quote .alt { color: var(--accent); }
.founder-byline {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 32px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}
.founder-byline b { color: var(--text); font-weight: 700; }
.founder-credit {
  font-size: 15px;
  color: var(--text-dim);
  line-height: 1.65;
  margin-bottom: 32px;
}
.founder-creds {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}
.founder-cred {
  background: var(--bg-2);
  padding: 18px 20px;
}
.founder-cred .k {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.founder-cred .v {
  font-size: 13px;
  color: var(--text);
  line-height: 1.4;
}

/* ───── FAQ ───── */
.faq { background: var(--bg-0); }
.faq-list { display: flex; flex-direction: column; }
.faq-item {
  border-bottom: 1px solid var(--border);
  padding: 24px 0;
  cursor: pointer;
}
.faq-item:first-child { border-top: 1px solid var(--border); }
.faq-q {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(20px, 2.2vw, 26px);
  text-transform: uppercase;
  letter-spacing: -0.005em;
}
.faq-q .plus { color: var(--accent); font-family: var(--font-mono); font-weight: 400; transition: transform 0.2s; }
.faq-item.open .faq-q .plus { transform: rotate(45deg); }
.faq-a {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
  opacity: 0;
  font-size: 15px;
  color: var(--text-dim);
  line-height: 1.7;
  max-width: 800px;
}
.faq-item.open .faq-a {
  max-height: 300px;
  opacity: 1;
  margin-top: 16px;
}

/* ───── FINAL CTA ───── */
.final-cta {
  padding: 160px 0;
  position: relative;
  text-align: center;
  background: var(--bg-0);
  overflow: hidden;
}
.final-cta::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, var(--accent-soft), transparent 60%);
}
.final-cta h2 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(64px, 12vw, 200px);
  line-height: 0.85;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  position: relative;
  margin-bottom: 32px;
}
.final-cta h2 .alt {
  font-style: italic;
  color: var(--accent);
}
.final-cta p {
  font-size: 19px;
  color: var(--text-dim);
  max-width: 580px;
  margin: 0 auto 40px;
  line-height: 1.55;
  position: relative;
}
.final-cta .cta-row {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  position: relative;
}

/* ───── FOOTER ───── */
.footer {
  border-top: 1px solid var(--border);
  background: var(--bg-1);
  padding: 48px 0 120px;
}
.footer-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 32px;
}
@media (max-width: 720px) { .footer-row { grid-template-columns: 1fr 1fr; } }
.footer-col h5 {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.footer-col a {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 13px;
  transition: color 0.15s;
}
.footer-col a:hover { color: var(--accent); }
.footer-meta {
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--dim);
  text-transform: uppercase;
}

/* ───── STICKY CTA BAR ───── */
.sticky-cta {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translate(-50%, 120%);
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 8px 8px 20px;
  background: rgba(10,11,14,0.92);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  max-width: calc(100vw - 32px);
}
.sticky-cta.show { transform: translate(-50%, 0); }
.sticky-cta .live {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  text-transform: uppercase;
}
.sticky-cta .live::before {
  content: '';
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 1.6s infinite;
}
.sticky-cta .live b { color: var(--accent); font-weight: 700; }
.sticky-cta .btn { height: 44px; }
@media (max-width: 600px) {
  .sticky-cta .live { display: none; }
  .sticky-cta { padding: 6px; }
}

/* misc */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
